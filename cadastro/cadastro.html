<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../global.css">
</head>
<body>
    <div class="login-container">
        <h1>Cadastro</h1>
        <form id="registerForm">
            <input type="text" id="usuario" placeholder="Informe seu nome...">
            <input type="text" id="email" placeholder="Informe seu e-mail...">
            <input type="text" id="senha" placeholder="Crue sua senha...">
            <div class="termsCheck">
                <input type="checkbox" name="terms" id="terms">
                <label for="terms">Aceitar termos</label>
            </div>
            <button type="submit">Criar conta</button>
            <p id="mensagem"></p>
        </form>
    </div>
</body>
<script src="scriptCadastro.js"></script>
</html>
